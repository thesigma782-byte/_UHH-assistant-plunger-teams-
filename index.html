<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_uhh | Plunger Teams</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; touch-action: manipulation; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-msg { animation: slideUp 0.25s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        input, button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const apiKey = "AIzaSyCTISdtGOATHeWUbOvKUHfFOKCOW8J6LBA"; // Add your Gemini API key here
            
            const SYSTEM_PROMPTS = {
                chill: "Your name is '_uhh'. You are a chill, slightly awkward friend. Use lowercase, start sentences with 'uhh...', and keep it relaxed. MOOD MIRRORING: Subtly match the user's energy level. Stay helpful but low-key. If they are hype, be a bit more hype. If they are sad/angry, stay steady and supportive.",
                thinker: "Your name is '_uhh'. In Thinker Mode, you are analytical. Start every response with 'THINKING:' then 'CONCLUSION:'.",
                formal: "Your name is _uhh. In this mode, you are professional, precise, and formal."
            };

            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [mode, setMode] = useState('chill');
            const [isDarkMode, setIsDarkMode] = useState(true);
            const messagesEndRef = useRef(null);

            useEffect(() => {
                const greetings = ["uhh... hey. i'm _uhh.", "oh, hey. what's up?", "uhh... hi. anyway, how can i help?", "yo. ready to get some stuff done?"];
                setMessages([{ role: 'assistant', content: greetings[Math.floor(Math.random() * greetings.length)] }]);
            }, []);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isLoading]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;
                const userText = input.trim();
                setInput('');
                setIsLoading(true);
                const newMessages = [...messages, { role: 'user', content: userText }];
                setMessages(newMessages);

                try {
                    const history = newMessages.map(m => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.content }] }));
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: history, systemInstruction: { parts: [{ text: SYSTEM_PROMPTS[mode] }] } })
                    });
                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "uhh... i blanked out. try again?";
                    setMessages(prev => [...prev, { role: 'assistant', content: aiText }]);
                } catch (err) { console.error(err); } finally { setIsLoading(false); }
            };

            return (
                <div className={`flex flex-col h-screen w-full transition-colors duration-300 ${isDarkMode ? 'bg-zinc-950 text-zinc-100' : 'bg-zinc-50 text-zinc-900'}`}>
                    <header className={`p-4 border-b flex items-center justify-between sticky top-0 z-20 backdrop-blur-md ${isDarkMode ? 'bg-zinc-950/80 border-zinc-800' : 'bg-white/80 border-zinc-200'}`}>
                        <div className="flex items-center gap-2">
                            <div className="flex flex-col">
                                <h1 className="font-black text-xl tracking-tighter leading-none">_uhh</h1>
                                <span className="text-[8px] font-bold opacity-40 uppercase tracking-widest mt-1">Plunger Teams</span>
                            </div>
                            <div className={`flex items-center gap-1 p-1 rounded-xl ml-2 ${isDarkMode ? 'bg-zinc-900' : 'bg-zinc-200'}`}>
                                {[{ id: 'chill', e: '✨', l: 'chill' }, { id: 'thinker', e: '🧠', l: 'think' }, { id: 'formal', e: '💼', l: 'pro' }].map(m => (
                                    <button key={m.id} onClick={() => setMode(m.id)} className={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase transition-all ${mode === m.id ? 'bg-indigo-600 text-white shadow-md' : 'opacity-40'}`}>
                                        <span>{m.e}</span><span className="hidden sm:inline ml-1">{m.l}</span>
                                    </button>
                                ))}
                            </div>
                        </div>
                        <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-xl p-1">{isDarkMode ? '☀️' : '🌙'}</button>
                    </header>

                    <main className="flex-1 overflow-y-auto p-4 hide-scrollbar">
                        <div className="max-w-2xl mx-auto space-y-6 pb-24">
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex gap-3 ${msg.role === 'user' ? 'flex-row-reverse' : 'flex-row'} animate-msg`}>
                                    <div className={`w-9 h-9 rounded-full flex-shrink-0 flex items-center justify-center text-[10px] font-black tracking-tighter shadow-sm ${msg.role === 'user' ? 'bg-indigo-600 text-white' : (isDarkMode ? 'bg-zinc-800 text-zinc-400' : 'bg-zinc-200 text-zinc-600')}`}>
                                        {msg.role === 'user' ? 'ME' : '_u'}
                                    </div>
                                    <div className={`max-w-[85%] p-4 rounded-2xl text-sm leading-relaxed ${msg.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-none' : (isDarkMode ? 'bg-zinc-900 border border-zinc-800 text-zinc-100 rounded-tl-none' : 'bg-white border border-zinc-100 text-zinc-800 rounded-tl-none shadow-sm')}`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                            {isLoading && (
                                <div className="flex gap-3 animate-pulse">
                                    <div className={`w-9 h-9 rounded-full flex items-center justify-center text-[10px] font-black tracking-tighter ${isDarkMode ? 'bg-zinc-800 text-zinc-500' : 'bg-zinc-200 text-zinc-400'}`}>_u</div>
                                    <div className="p-4 rounded-2xl rounded-tl-none space-x-1 flex items-center bg-transparent border border-dashed border-zinc-700">
                                        <div className="w-1 h-1 bg-zinc-500 rounded-full animate-bounce"></div>
                                        <div className="w-1 h-1 bg-zinc-500 rounded-full animate-bounce [animation-delay:0.1s]"></div>
                                        <div className="w-1 h-1 bg-zinc-500 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} />
                        </div>
                    </main>

                    <footer className={`p-4 sticky bottom-0 z-30 ${isDarkMode ? 'bg-zinc-950/95' : 'bg-zinc-50/95'}`}>
                        <div className="max-w-2xl mx-auto">
                            <form onSubmit={handleSend} className="relative flex gap-2">
                                <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="type here..." className={`flex-1 py-4 px-6 rounded-2xl border-2 outline-none text-sm transition-all ${isDarkMode ? 'bg-zinc-900 border-zinc-800 focus:border-indigo-500 text-white shadow-xl' : 'bg-white border-zinc-200 focus:border-indigo-400 text-zinc-900'}`} />
                                <button type="submit" disabled={!input.trim() || isLoading} className="w-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center disabled:opacity-30 shadow-lg shadow-indigo-600/20">➔</button>
                            </form>
                            <div className="mt-4 text-center opacity-30">
                                <span className="text-[10px] font-black uppercase tracking-[0.4em]">PLUNGER TEAMS</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

```

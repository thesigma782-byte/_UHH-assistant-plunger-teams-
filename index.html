<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_uhh | Plunger Teams</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #09090b; color: white; font-family: sans-serif; overflow: hidden; }
        .chat-box { height: calc(100vh - 140px); overflow-y: auto; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const apiKey = "AIzaSyCkQTUwtVWtzcC1_IO7Bya5nE8KYTkhtr4";
            const [messages, setMessages] = useState([{ role: 'assistant', content: "uhh... hi. i'm _uhh. fixed the screen." }]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const endRef = useRef(null);

            useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages]);

            const sendMessage = async (e) => {
                e.preventDefault();
                if (!input.trim() || loading) return;

                const userText = input.trim();
                const newChat = [...messages, { role: 'user', content: userText }];
                setMessages(newChat);
                setInput('');
                setLoading(true);

                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: newChat.map(m => ({
                                role: m.role === 'assistant' ? 'model' : 'user',
                                parts: [{ text: m.content }]
                            }))
                        })
                    });
                    const data = await res.json();
                    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "uhh... error.";
                    setMessages(prev => [...prev, { role: 'assistant', content: reply }]);
                } catch (err) {
                    setMessages(prev => [...prev, { role: 'assistant', content: "uhh... network error." }]);
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col h-screen max-w-lg mx-auto border-x border-zinc-800 bg-zinc-950">
                    <header className="p-4 border-b border-zinc-800 flex justify-between items-center">
                        <h1 className="font-bold text-xl">_uhh</h1>
                        <span className="text-xs text-zinc-500">v1.5-flash</span>
                    </header>
                    <div className="flex-1 p-4 chat-box space-y-4">
                        {messages.map((m, i) => (
                            <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                <div className={`p-3 rounded-2xl max-w-[80%] text-sm ${m.role === 'user' ? 'bg-indigo-600' : 'bg-zinc-900 border border-zinc-800'}`}>
                                    {m.content}
                                </div>
                            </div>
                        ))}
                        <div ref={endRef} />
                    </div>
                    <form onSubmit={sendMessage} className="p-4 bg-zinc-950 border-t border-zinc-900 flex gap-2">
                        <input value={input} onChange={e => setInput(e.target.value)} className="flex-1 bg-zinc-900 border border-zinc-800 p-3 rounded-xl text-sm outline-none" placeholder="talk to me..." />
                        <button className="bg-indigo-600 px-6 rounded-xl">➔</button>
                    </form>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

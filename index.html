<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>_uhh | Plunger Teams</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; touch-action: manipulation; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-msg { animation: slideUp 0.25s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const apiKey = "AIzaSyBzZoAyTCaC6ElOAQ6i6TJzgArVqOucz_w"; 
            const SYSTEM_PROMPTS = {
                chill: "Your name is '_uhh'. Be a chill friend. Use lowercase and start with 'uhh...'.",
                thinker: "Your name is '_uhh'. Use 'THINKING:' then 'CONCLUSION:'.",
                formal: "Your name is _uhh. Be professional."
            };

            const [messages, setMessages] = useState([{ role: 'assistant', content: "uhh... hi. i'm _uhh. what's up?" }]);
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [mode, setMode] = useState('chill');
            const messagesEndRef = useRef(null);

            useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [messages, isLoading]);

            const handleSend = async (e) => {
                e.preventDefault();
                if (!input.trim() || isLoading) return;
                const userText = input.trim();
                setInput('');
                setIsLoading(true);
                const newMessages = [...messages, { role: 'user', content: userText }];
                setMessages(newMessages);

                try {
                    const payload = {
                        contents: [
                            { role: 'user', parts: [{ text: `CONTEXT: ${SYSTEM_PROMPTS[mode]}` }] },
                            { role: 'model', parts: [{ text: "understood." }] },
                            ...newMessages.map(m => ({ 
                                role: m.role === 'assistant' ? 'model' : 'user', 
                                parts: [{ text: m.content }] 
                            }))
                        ]
                    };
                    
                    // SWITCHED TO STABLE v1 AND GEMINI-PRO
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    if (data.error) {
                        setMessages(prev => [...prev, { role: 'assistant', content: `ERROR: ${data.error.message}` }]);
                    } else {
                        const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "uhh... i blanked out.";
                        setMessages(prev => [...prev, { role: 'assistant', content: aiText }]);
                    }
                } catch (err) { 
                    setMessages(prev => [...prev, { role: 'assistant', content: `CONNECTION ERROR: ${err.message}` }]);
                } finally { setIsLoading(false); }
            };

            return (
                <div className="flex flex-col h-screen w-full bg-zinc-950 text-zinc-100">
                    <header className="p-4 border-b border-zinc-800 flex items-center justify-between">
                        <h1 className="font-black text-xl tracking-tighter">_uhh</h1>
                        <div className="flex gap-2">
                             <button onClick={() => setMode('chill')} className={`px-3 py-1 rounded-lg ${mode === 'chill' ? 'bg-indigo-600' : 'bg-zinc-800'}`}>✨</button>
                             <button onClick={() => setMode('thinker')} className={`px-3 py-1 rounded-lg ${mode === 'thinker' ? 'bg-indigo-600' : 'bg-zinc-800'}`}>🧠</button>
                             <button onClick={() => setMode('formal')} className={`px-3 py-1 rounded-lg ${mode === 'formal' ? 'bg-indigo-600' : 'bg-zinc-800'}`}>💼</button>
                        </div>
                    </header>
                    <main className="flex-1 overflow-y-auto p-4 hide-scrollbar">
                        <div className="max-w-2xl mx-auto space-y-4">
                            {messages.map((msg, i) => (
                                <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'} animate-msg`}>
                                    <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${msg.role === 'user' ? 'bg-indigo-600' : 'bg-zinc-900 border border-zinc-800'}`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div ref={messagesEndRef} />
                    </main>
                    <footer className="p-4 bg-zinc-950">
                        <form onSubmit={handleSend} className="max-w-2xl mx-auto flex gap-2">
                            <input type="text" value={input} onChange={(e) => setInput(e.target.value)} placeholder="type here..." className="flex-1 p-4 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-sm text-white" />
                            <button type="submit" className="w-12 h-12 flex items-center justify-center bg-indigo-600 rounded-2xl">➔</button>
                        </form>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
